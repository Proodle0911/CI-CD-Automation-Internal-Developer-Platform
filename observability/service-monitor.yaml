apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-service-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: sample-service
  namespaceSelector:
    any: true
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
